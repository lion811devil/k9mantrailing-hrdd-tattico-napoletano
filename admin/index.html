<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>Gestione sito - K9 Napoletano Academy</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <style>
    html,body{margin:0;min-height:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%}
    #k9HelpBtn{position:fixed;right:10px;bottom:max(10px,env(safe-area-inset-bottom));z-index:999999;border:0;border-radius:999px;padding:10px 14px;font:700 12px Arial,sans-serif;background:#111;color:#fff;box-shadow:0 6px 20px #0004}
    #k9Help{display:none;position:fixed;inset:0;z-index:1000000;background:#0009;padding:12px;overflow:auto}
    #k9Help.open{display:flex;align-items:flex-start;justify-content:center}
    #k9HelpCard{width:min(560px,100%);max-height:calc(100vh - 24px);overflow:auto;background:#fff;color:#111;border-radius:16px;padding:18px;font:15px/1.5 Arial,sans-serif;box-sizing:border-box}
    #k9HelpCard button{width:100%;margin-top:16px;padding:12px;border:0;border-radius:10px;background:#111;color:#fff;font-weight:700}
  </style>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@3.15.1/dist/decap-cms.js"></script>
  <button id="k9HelpBtn" type="button">GUIDA RAPIDA</button>
  <div id="k9Help" aria-hidden="true"><div id="k9HelpCard">
    <h2>Gestione sito</h2>
    <p>Questa versione non applica alcuna modifica CSS o JavaScript all'interfaccia di Decap CMS.</p>
    <p>Le configurazioni complete del CMS sono state ripristinate.</p>
    <button id="k9HelpClose" type="button">CHIUDI</button>
  </div></div>
  <script>
    (function(){
      var btn=document.getElementById('k9HelpBtn'), modal=document.getElementById('k9Help'), close=document.getElementById('k9HelpClose');
      btn.addEventListener('click',function(){modal.classList.add('open');modal.setAttribute('aria-hidden','false')});
      close.addEventListener('click',function(){modal.classList.remove('open');modal.setAttribute('aria-hidden','true')});
      modal.addEventListener('click',function(e){if(e.target===modal)close.click()});
    })();
  </script>
</body>
</html>
