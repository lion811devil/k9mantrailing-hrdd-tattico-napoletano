      - label: Attivo
        name: active
        widget: boolean
        default: true
        required: false
      - label: Titolo principale
        name: title
        widget: string
        required: false
      - label: Sottotitolo
        name: subtitle
        widget: markdown
        required: false
      - label: Frase breve sopra il titolo principale
        name: tagline
        widget: string
        required: false
      - label: Immagine di sfondo
        name: backgroundImage
        widget: image
        required: false
      - label: Immagine in primo piano
        name: subjectImage
        widget: image
        required: false
      - label: Posizione dell’immagine in primo piano
        name: subjectPosition
        widget: select
        required: false
        options:
        - label: Destra
          value: right
        - label: Sinistra
          value: left
        - label: Centro
          value: center
      - label: Dimensione dell’immagine in primo piano
        name: subjectWidth
        widget: string
        required: false
      - label: Trasparenza dell’immagine in primo piano
        name: subjectOpacity
        widget: string
        required: false
      - label: Oscuramento dello sfondo
        name: overlayOpacity
        widget: string
        required: false
