        name: slides
        widget: list
        required: false
        summary: '{{fields.title}}'
        fields:
        - label: Attiva
          name: active
          widget: boolean
          default: true
          required: false
        - label: Titolo
          name: title
          widget: string
          required: false
        - label: Sottotitolo
          name: subtitle
          widget: markdown
          required: false
        - label: Frase breve sopra il titolo principale
          name: tagline
          widget: string
          required: false
        - label: Immagine di sfondo
          name: backgroundImage
          widget: image
          required: false
        - label: Immagine in primo piano
          name: subjectImage
          widget: image
          required: false
        - label: Posizione dell’immagine in primo piano
