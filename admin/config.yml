        - label: Sistema moderno
          value: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif
        - label: Trebuchet - dinamico
          value: '''Trebuchet MS'', Arial, sans-serif'
        - label: Verdana - leggibile
          value: Verdana, Geneva, sans-serif
        - label: Georgia - elegante
          value: Georgia, 'Times New Roman', serif
        hint: Scegli un carattere pronto, senza scrivere codici.
      - label: Carattere dei testi
        name: bodyFont
        widget: select
        required: false
        options: *id001
        hint: Scegli un carattere pronto, senza scrivere codici.
      - label: Carattere dei pulsanti
        name: buttonFont
        widget: select
        required: false
        options: *id001
        hint: Scegli un carattere pronto, senza scrivere codici.
