backend:
  name: git-gateway
  branch: main
local_backend: false
media_folder: assets/uploads
public_folder: /assets/uploads
site_url: https://k9mantrailing-hrdd-tattico-napoletano.netlify.app
display_url: https://k9mantrailing-hrdd-tattico-napoletano.netlify.app
collections:
- name: home_easy
  label: 01 HOME
  editor:
    preview: false
  files:
  - label: HOME E ASPETTO
    name: home_theme
    file: content/home.json
    format: json
    fields:
    - label: Nome del sito
      name: siteName
      widget: string
    - label: Aspetto del sito
      name: activeTheme
      widget: select
      required: true
      hint: Scegli un tema pronto. Non devi configurare colori o font.
      options:
      - label: Nero e Oro
        value: Nero e Oro
      - label: Arancione Academy
        value: Arancione Academy
      - label: Verde Operativo
        value: Verde Operativo
      - label: Blu Acciaio
        value: Blu Acciaio
      - label: Bianco Moderno
        value: Bianco Moderno
      - label: Grigio Tecnico
        value: Grigio Tecnico
      - label: Personalizzato
        value: Personalizzato
      - label: Blu Notte
        value: Blu Notte
      - label: Verde Bosco
        value: Verde Bosco
      - label: Bordeaux Elegante
        value: Bordeaux Elegante
      - label: Sabbia Premium
        value: Sabbia Premium
      - label: Ghiaccio
        value: Ghiaccio
      - label: Mediterraneo
        value: Mediterraneo
      - label: Protezione Civile
        value: Protezione Civile
      - label: Rosso Tecnico
        value: Rosso Tecnico
      - label: Viola Notte
        value: Viola Notte
      - label: Terra e Cuoio
        value: Terra e Cuoio
      - label: Azzurro Professionale
        value: Azzurro Professionale
      - label: Minimal Nero Bianco
        value: Minimal Nero Bianco
      - label: Alta Visibilità
        value: Alta Visibilità
      default: Nero e Oro
    - label: Logo principale
      name: logo
      widget: image
      required: false
      hint: Tocca Scegli immagine per caricare o selezionare il logo.
    - label: Secondo logo (facoltativo)
      name: logoSecondary
      widget: image
      required: false
      hint: Lascialo vuoto se non vuoi mostrare un secondo logo.
    - label: Frase breve sopra il titolo
      name: tagline
      widget: string
      required: false
    - label: Titolo della copertina
      name: heroTitle
      widget: string
      hint: Modifica il grande titolo visibile nella prima schermata del sito.
    - label: Testo della copertina
      name: heroSubtitle
      widget: markdown
      required: false
      hint: Modifica il testo mostrato sotto il titolo principale.
    - label: Foto della copertina
      name: heroImage
      widget: image
      required: false
      hint: È la foto grande visibile all’apertura del sito.
    - label: Avviso in alto
      name: banner
      widget: object
      required: false
      fields:
      - label: Mostra avviso
        name: active
        widget: boolean
        default: false
        required: false
      - label: Testo avviso
        name: text
        widget: string
        required: false
      - label: Sfondo banner
        name: background
        widget: hidden
        required: false
      - label: Colore testo banner
        name: textColor
        widget: hidden
        required: false
      collapsed: true
    - label: Messaggio a comparsa
      name: popup
      widget: object
      required: false
      fields:
      - label: Mostra messaggio
        name: active
        widget: boolean
        default: false
        required: false
      - label: Titolo
        name: title
        widget: string
        required: false
      - label: Testo
        name: text
        widget: markdown
        required: false
      collapsed: true
    - label: Anteprima Google e social
      name: seo
      widget: object
      required: false
      fields:
      - label: Titolo SEO
        name: title
        widget: string
        required: false
      - label: Descrizione SEO
        name: description
        widget: text
        required: false
      - label: Immagine anteprima social
        name: image
        widget: image
        required: false
      collapsed: true
      hint: Facoltativo. Serve solo per titolo, descrizione e immagine quando il sito viene condiviso.
    - label: Mostra o nascondi sezioni
      name: sectionVisibility
      widget: object
      required: false
      fields:
      - label: Mostra Copertina iniziale
        name: hero
        widget: boolean
        default: true
        required: false
      - label: Mostra Profilo
        name: owner
        widget: boolean
        default: true
        required: false
      - label: Mostra Discipline
        name: disciplines
        widget: boolean
        default: true
        required: false
      - label: Mostra Cani
        name: dogs
        widget: boolean
        default: true
        required: false
      - label: Mostra Corsi
        name: courses
        widget: boolean
        default: true
        required: false
      - label: Mostra Eventi
        name: events
        widget: boolean
        default: true
        required: false
      - label: Mostra Galleria
        name: gallery
        widget: boolean
        default: true
        required: false
      - label: Mostra Partner
        name: partners
        widget: boolean
        default: true
        required: false
      - label: Mostra FAQ
        name: faq
        widget: boolean
        default: true
        required: false
      - label: Mostra Contatti
        name: contacts
        widget: boolean
        default: true
        required: false
      hint: Attiva solo le sezioni che vuoi vedere nel sito.
      collapsed: true
    - label: Testo finale del sito
      name: footer
      widget: markdown
      required: false
    - label: Copertina avanzata
      name: heroManager
      widget: hidden
      required: false
    - label: Foto copertina a rotazione
      name: heroImages
      widget: hidden
      required: false
    - label: Temi e colori personalizzati (avanzato)
      name: themes
      widget: hidden
      required: false
    - label: Voci del menu
      name: menu
      widget: hidden
      required: false
    - label: Ordine delle sezioni (avanzato)
      name: sectionOrder
      widget: hidden
      required: false
    - label: Impostazioni avanzate del sito
      name: settings
      widget: hidden
      required: false
    - label: Titoli delle sezioni
      name: sectionTexts
      widget: hidden
      required: false
